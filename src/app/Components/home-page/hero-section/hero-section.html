<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <span class="hero-label">{{ 'hero.georgianAdventures' | translate }}</span>
    <h1>{{ 'hero.title' | translate }}</h1>
    <p>{{ 'hero.description' | translate }}</p>
    <button class="btn-primary">{{ 'hero.exploreTours' | translate }}</button>
  </div>
</section>
<div class="hero-stats">
  <div class="stat-item">
    <div class="stat-num">500+</div>
    <div class="stat-label">{{ 'hero.HappyTravelers' | translate }}</div>
  </div>
  <div class="stat-item">
    <div class="stat-num">15+</div>
    <div class="stat-label">{{ 'hero.TourRoutes' | translate }}</div>
  </div>
  <div class="stat-item">
    <div class="stat-num">2</div>
    <div class="stat-label">{{ 'hero.CountriesVisited' | translate }}</div>
  </div>
  <div class="stat-item">
    <div class="stat-num">5★</div>
    <div class="stat-label">{{ 'hero.RatedExperiences' | translate }}</div>
  </div>
</div>
