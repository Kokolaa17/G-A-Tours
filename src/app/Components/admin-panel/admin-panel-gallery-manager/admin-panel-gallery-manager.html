
<section id="gallery-upload">
  <div class="section-header">
    <h2 class="section-title">Upload Photo</h2>
    <p class="section-desc">Add a new photo to the gallery.</p>
  </div>

  <form class="upload-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div
      class="upload-drop"
      [class.dragging]="dragging()"
      [class.has-image]="previewUrl()"
      (dragover)="onDragOver($event)"
      (dragleave)="dragging.set(false)"
      (drop)="onDrop($event)"
    >
      @if (previewUrl()) {
        <img [src]="previewUrl()" alt="Selected photo preview" />
        <button type="button" class="remove-btn" (click)="removeFile()" aria-label="Remove photo">✕</button>
        @if (file) {
          <span class="file-badge">{{ file.name }}</span>
        }
      } @else {
        <label class="drop-empty" for="gallery-image-input">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <circle cx="9" cy="9" r="1.6" />
            <path d="M21 15l-5-5L5 21" />
          </svg>
          <strong>Drop a photo here</strong>
          <span>or click to browse · JPG, PNG, WEBP up to 10 MB</span>
        </label>
      }
      <input id="gallery-image-input" type="file" accept="image/*" hidden (change)="onFileInput($event)" />
    </div>

    <!-- Right: fields -->
    <div class="upload-fields">
      <div class="field">
        <label for="up-name">Name <em>*</em></label>
        <input id="up-name" type="text" formControlName="name" placeholder="e.g. Trabzon Uzungöl" />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <small class="error">Name is required.</small>
        }
      </div>

      <div class="field">
        <label for="up-location">Location</label>
        <input id="up-location" type="text" formControlName="location" placeholder="e.g. Trabzon, Turkey" />
      </div>

      <div class="field">
        <label for="up-caption">Caption</label>
        <textarea id="up-caption" rows="4" formControlName="caption" placeholder="Short description of the moment"></textarea>
      </div>

      @if (status(); as s) {
        <p class="status" [class.success]="s.type === 'success'" [class.error]="s.type === 'error'" role="status">
          {{ s.text }}
        </p>
      }

      <div class="upload-actions">
        <button type="button" class="btn-ghost" (click)="reset()" [disabled]="submitting()">Reset</button>
        <button type="submit" class="btn-sm" [disabled]="submitting()">
          {{ submitting() ? 'Uploading…' : 'Upload photo' }}
        </button>
      </div>
    </div>
  </form>
</section>

<app-gallery-page></app-gallery-page>
